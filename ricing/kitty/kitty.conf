# BEGIN_KITTY_THEME
# Idle Toes
include current-theme.conf
# END_KITTY_THEME

# Força o uso do ZSH
shell /usr/bin/zsh

# Habilita o CTRL + V
map ctrl+v paste_from_clipboard

# Inverte o CTRL + C pra Copiar
# Inverte o CTRL + SIFT + C pra Cancelar
map ctrl+c copy_to_clipboard
map ctrl+shift+c send_text all \x03

# Fundo Transparente
background_opacity 0.8
dynamic_background_opacity yes
#background_blur 1
