# BEGIN_KITTY_THEME
# Idle Toes
include current-theme.conf
# END_KITTY_THEME

# Fonte
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Usa fish se existir, senão cai pro zsh
shell /bin/sh -c 'exec "$(command -v fish || command -v zsh)"'

# Ctrl+V desmapeado: deixa Claude Code tratar paste de imagem direto
#map ctrl+v paste_from_clipboard

# Nova aba abre no path atual, não na home
map ctrl+shift+t new_tab_with_cwd

# Inverte o CTRL + C pra Copiar
# Inverte o CTRL + SIFT + C pra Cancelar
map ctrl+c copy_to_clipboard
map ctrl+shift+c send_text all \x03

# Fundo Transparente
background_opacity 0.8
dynamic_background_opacity yes
#background_blur 1

# Performance
repaint_delay 8
input_delay 2
sync_to_monitor no
