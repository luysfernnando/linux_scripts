command_timeout = 500
scan_timeout = 10
format = """$directory$git_branch$git_status
$character"""

[directory]
truncation_length = 3
style = "bold cyan"
format = "[ $path]($style)[ ❯ ](bold white)"
read_only = " 󰌾"

[git_branch]
style = "bold yellow"
format = "[$symbol $branch]($style)[ ](bold white)"
symbol = ""

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "󰞇 ${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = " ${count} "
stashed = "󰆓${count} "
modified = " ${count} "
staged = " ${count} "
renamed = "»${count} "
deleted = "✘${count} "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

