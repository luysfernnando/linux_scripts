[package]
name = "sysup"
version.workspace = true
edition.workspace = true

[lib]
name = "sysup"
path = "src/lib.rs"

[[bin]]
name = "sysup"
path = "src/main.rs"

[dependencies]
ipc = { path = "../ipc" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
semver = "1"
regex = "1"
ratatui = "0.29"
crossterm = "0.28"
nix = { version = "0.29", features = ["user", "fs"] }
which = "6"

[dev-dependencies]
tempfile = "3"
